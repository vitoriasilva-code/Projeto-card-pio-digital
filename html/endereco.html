<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endereço de entrega | Love Junck Lanchonete</title>
    <link rel="stylesheet" href="../css/endereco.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="checkout-header">
        <a href="../index.html"><i class="fa-solid fa-arrow-left"></i> Voltar ao cardápio</a>
    </header>

    <main>
        <section class="grid">
            <div class="md:col-span-2 bg-white rounded-xl shadow-md p-6">
                <h1>Endereço de entrega</h1>

                <form id="form-address" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" name="cep" placeholder="00000-000"
                                autocomplete="postal-code" inputmode="numeric" required>
                        </div>
                        <div>
                            <label for="numero">Número</label>
                            <input type="text" id="numero" name="numero" placeholder="Ex.: 123"
                                autocomplete="address-line2" required>
                        </div>
                    </div>

                    <div>
                        <label for="rua">Endereço (rua/avenida)</label>
                        <input type="text" id="rua" name="rua" placeholder="Ex.: Rua das Flores"
                            autocomplete="street-address" required>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" name="bairro" placeholder="Ex.: Centro" required>
                        </div>
                        <div>
                            <label for="complemento">Complemento (opcional)</label>
                            <input type="text" id="complemento" name="complemento" placeholder="Ex.: Apto 402">
                        </div>
                    </div>

                    <div>
                        <label for="telefone">Telefone para contato</label>
                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000"
                            autocomplete="tel" inputmode="tel" required>
                    </div>

                    <button type="submit">
                        Ir para pagamento <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script src="../scripts/endereco.js"></script>
</body>

</html>
