<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento | Cardápio Digital</title>

    <link rel="stylesheet" href="../css/pagamento.css">

    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <main>
        <div class="checkout-container">

            <!-- ETAPA 2: FORMA DE PAGAMENTO -->
            <section id="step-2-content" class="payment-card">

                <div class="payment-header">
                    <h2>
                        <i class="fa-solid fa-credit-card"></i>
                        Forma de Pagamento
                    </h2>

                    <button type="button" class="back-button">
                        <i class="fa-solid fa-arrow-left"></i>
                        Voltar
                    </button>
                </div>

                <p>Escolha como deseja pagar seu pedido.</p>

                <div class="payment-options">

                    <!-- PIX -->
                    <label class="payment-option">
                        <input type="radio" name="payment-method" value="pix">

                        <span>
                            <i class="fa-brands fa-pix pix-icon"></i>

                            <span>
                                <strong>PIX</strong>
                                <small>Pagamento instantâneo</small>
                            </span>
                        </span>
                    </label>

                    <!-- CARTÃO -->
                    <label class="payment-option">
                        <input type="radio" name="payment-method" value="card">

                        <span>
                            <i class="fa-solid fa-credit-card card-icon"></i>

                            <span>
                                <strong>Cartão</strong>
                                <small>Crédito ou débito na entrega</small>
                            </span>
                        </span>
                    </label>

                    <!-- DINHEIRO -->
                    <label class="payment-option">
                        <input type="radio" name="payment-method" value="cash">

                        <span>
                            <i class="fa-solid fa-money-bill-wave cash-icon"></i>

                            <span>
                                <strong>Dinheiro na entrega</strong>
                                <small>Pague ao receber seu pedido</small>
                            </span>
                        </span>
                    </label>

                </div>

                <!-- CAMPOS EXTRAS DO PAGAMENTO -->
                <div id="payment-extra-fields" class="payment-extra-fields" aria-live="polite"></div>

                <button type="button" class="finalize-button">
                    <i class="fa-solid fa-check"></i>
                    Finalizar Pedido
                </button>
                <p class="order-status" role="status" aria-live="polite"></p>

            </section>

            <!-- RESUMO DO PEDIDO -->
            <aside class="cart-summary">

                <h2>
                    <i class="fa-solid fa-receipt"></i>
                    Resumo do Pedido
                </h2>

                <div class="cart-items"></div>

                <div class="cart-totals">
                    <div class="total-row grand-total">
                        <span>Total</span>
                        <span class="order-total">R$ 0,00</span>
                    </div>

                </div>

            </aside>

            <!-- PEDIDO FINALIZADO -->
            <section id="step-success" class="success-card hidden">

                <div class="success-icon">
                    <i class="fa-solid fa-check"></i>
                </div>

                <h2>Pedido Realizado com Sucesso!</h2>

                <p>
                    Obrigado pela preferência!
                    Seu pedido foi finalizado.
                </p>

                <div class="success-actions">
                    <button type="button" class="new-order-button">
                        Fazer Novo Pedido
                    </button>
                </div>

            </section>

        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>© 2026 Cardápio digital. Todos os direitos reservados.</p>
    </footer>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/pagamento.js"></script>
</body>

</html>
